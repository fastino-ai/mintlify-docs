name: Agent docs harness

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static agent journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts/tests -p "test_agent_harness.py"
      - run: python scripts/agent_harness.py static

  published:
    name: Published discovery and links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/agent_harness.py published

  authenticated-api:
    name: Authenticated agent happy paths
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      vars.ENABLE_DOCS_API_CANARY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/agent_harness.py api
        env:
          FASTINO_DOCS_CANARY_API_KEY: ${{ secrets.FASTINO_DOCS_CANARY_API_KEY }}
          FASTINO_DOCS_CANARY_DATASET: ${{ vars.FASTINO_DOCS_CANARY_DATASET }}
          FASTINO_DOCS_CANARY_DATASET_VERSION: ${{ vars.FASTINO_DOCS_CANARY_DATASET_VERSION }}

  training-replay:
    name: Training idempotency replay
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      vars.ENABLE_DOCS_TRAINING_REPLAY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/agent_harness.py training-replay
        env:
          FASTINO_DOCS_CANARY_API_KEY: ${{ secrets.FASTINO_DOCS_CANARY_API_KEY }}
          FASTINO_DOCS_CANARY_DATASET: ${{ vars.FASTINO_DOCS_CANARY_DATASET }}
          FASTINO_DOCS_CANARY_DATASET_VERSION: ${{ vars.FASTINO_DOCS_CANARY_DATASET_VERSION }}
          FASTINO_DOCS_CANARY_TRAINING_JOB_ID: ${{ vars.FASTINO_DOCS_CANARY_TRAINING_JOB_ID }}
          FASTINO_DOCS_CANARY_IDEMPOTENCY_KEY: ${{ vars.FASTINO_DOCS_CANARY_IDEMPOTENCY_KEY }}
          FASTINO_DOCS_CANARY_BASE_MODEL: ${{ vars.FASTINO_DOCS_CANARY_BASE_MODEL }}
