name: Agent docs harness

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pioneer-parity:
    name: Pioneer development parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require Pioneer read token
        env:
          PIONEER_DOCS_TOKEN: ${{ secrets.PIONEER_DOCS_TOKEN }}
        run: |
          if [ -z "$PIONEER_DOCS_TOKEN" ]; then
            echo "::error::Configure PIONEER_DOCS_TOKEN with read access to fastino-ai/Pioneer"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: fastino-ai/Pioneer
          ref: development
          path: pioneer
          token: ${{ secrets.PIONEER_DOCS_TOKEN }}
      - run: python scripts/check_api_docs.py --pioneer-root pioneer --include-locales

  static:
    name: Static agent journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-agent-harness.txt
      - run: python -m pip install -r scripts/requirements-agent-harness.txt
      - run: python -m unittest discover -s scripts/tests -p "test_*.py"
      - run: python scripts/agent_harness.py static
      - run: python scripts/agent_harness.py training-snippets

  published:
    name: Published discovery and links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-agent-harness.txt
      - run: python -m pip install -r scripts/requirements-agent-harness.txt
      - run: python scripts/agent_harness.py published

  diagnostics:
    name: Discovery cache and crawler diagnostics
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-agent-harness.txt
      - run: python -m pip install -r scripts/requirements-agent-harness.txt
      - run: python scripts/agent_harness.py diagnostics

  authenticated-api:
    name: Authenticated agent happy paths
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_DOCS_API_CANARY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-agent-harness.txt
      - run: python -m pip install -r scripts/requirements-agent-harness.txt
      - run: python scripts/agent_harness.py api
        env:
          FASTINO_DOCS_CANARY_API_KEY: ${{ secrets.FASTINO_DOCS_CANARY_API_KEY }}
          FASTINO_DOCS_CANARY_DATASET: ${{ vars.FASTINO_DOCS_CANARY_DATASET }}
          FASTINO_DOCS_CANARY_DATASET_VERSION: ${{ vars.FASTINO_DOCS_CANARY_DATASET_VERSION }}
      - run: python scripts/agent_harness.py cookbooks
        env:
          FASTINO_DOCS_CANARY_API_KEY: ${{ secrets.FASTINO_DOCS_CANARY_API_KEY }}
          FASTINO_DOCS_CANARY_DATASET: ${{ vars.FASTINO_DOCS_CANARY_DATASET }}
          FASTINO_DOCS_CANARY_DATASET_VERSION: ${{ vars.FASTINO_DOCS_CANARY_DATASET_VERSION }}
      - run: python scripts/agent_harness.py training-snippets --live
        env:
          FASTINO_DOCS_CANARY_API_KEY: ${{ secrets.FASTINO_DOCS_CANARY_API_KEY }}
          FASTINO_DOCS_CANARY_DATASET: ${{ vars.FASTINO_DOCS_CANARY_DATASET }}
          FASTINO_DOCS_CANARY_DATASET_VERSION: ${{ vars.FASTINO_DOCS_CANARY_DATASET_VERSION }}
          FASTINO_DOCS_CANARY_TRAINING_JOB_ID: ${{ vars.FASTINO_DOCS_CANARY_TRAINING_JOB_ID }}

  training-replay:
    name: Training idempotency replay
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_DOCS_TRAINING_REPLAY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-agent-harness.txt
      - run: python -m pip install -r scripts/requirements-agent-harness.txt
      - run: python scripts/agent_harness.py training-replay
        env:
          FASTINO_DOCS_CANARY_API_KEY: ${{ secrets.FASTINO_DOCS_CANARY_API_KEY }}
          FASTINO_DOCS_CANARY_DATASET: ${{ vars.FASTINO_DOCS_CANARY_DATASET }}
          FASTINO_DOCS_CANARY_DATASET_VERSION: ${{ vars.FASTINO_DOCS_CANARY_DATASET_VERSION }}
          FASTINO_DOCS_CANARY_TRAINING_JOB_ID: ${{ vars.FASTINO_DOCS_CANARY_TRAINING_JOB_ID }}
          FASTINO_DOCS_CANARY_IDEMPOTENCY_KEY: ${{ vars.FASTINO_DOCS_CANARY_IDEMPOTENCY_KEY }}
          FASTINO_DOCS_CANARY_BASE_MODEL: ${{ vars.FASTINO_DOCS_CANARY_BASE_MODEL }}
