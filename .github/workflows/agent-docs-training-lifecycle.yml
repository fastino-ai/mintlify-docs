name: Agent docs training lifecycle

on:
  schedule:
    - cron: "41 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-docs-training-lifecycle
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Dataset to trained-model inference
    if: vars.ENABLE_FULL_TRAINING_CANARY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-agent-harness.txt
      - run: python -m pip install -r scripts/requirements-agent-harness.txt
      - name: Run guarded lifecycle
        run: python scripts/agent_harness.py training-lifecycle
        env:
          FASTINO_DOCS_CANARY_API_KEY: ${{ secrets.FASTINO_DOCS_CANARY_API_KEY }}
          FASTINO_DOCS_CANARY_DATASET: ${{ vars.FASTINO_DOCS_CANARY_DATASET }}
          FASTINO_DOCS_CANARY_DATASET_VERSION: ${{ vars.FASTINO_DOCS_CANARY_DATASET_VERSION }}
          FASTINO_DOCS_CANARY_BASE_MODEL: ${{ vars.FASTINO_DOCS_CANARY_BASE_MODEL }}
          FASTINO_DOCS_CANARY_MAX_GPU_MINUTES: "28"
          FASTINO_DOCS_CANARY_TIMEOUT_SECONDS: "3000"
          FASTINO_DOCS_CANARY_DELETE_SUCCESSFUL: "true"
